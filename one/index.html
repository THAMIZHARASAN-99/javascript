<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="author" content="TamilShradha" />
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css" />
    <body>
      <main class="container">
        <h1>Semmai Seeds</h1>
        <form action="">
          <div class="form_group">
            <label for="name">User Name<span class="required">*</span></label>
            <input
              type="text"
              id="name"
              required
              placeholder="enter your user name"
              pattern="[A-Za-z]+"
              minlength="3"
              maxlength="20"
            />
            <small class="error_msg">Enter valid user name</small>
          </div>
          <div class="form_group">
            <label for="email">Email <span class="required">*</span></label>
            <input
              type="email"
              id="email"
              required
              placeholder="enter your email"
            />
            <small class="error_msg">Enter valid Email</small>
          </div>
          <div class="form_group">
            <label for="password"
              >Password<span class="required">*</span></label
            >
            <input
              type="password"
              id="pass"
              required
              placeholder="enter your password"
              minlength="8"
            />
            <small class="error_msg"
              >Enter a password at least 8 characters long</small
            >
          </div>
          <div class="form_group">
            <label for="text">Message Us<span class="required">*</span></label>
            <textarea
              name="text"
              id="text"
              rows="5"
              cols="20"
              placeholder="enter your message"
            ></textarea>
          </div>
          <div class="button">
            <button type="submit">Register</button>
          </div>
        </form>
      </main>
    </body>
  </head>
</html>
